# Quantumult X 1.5.5 build 914+ | SHIKI1255/quantumultx-config
# Import this template once, then add your own nodes locally and use Filter mode.
# Rules and rewrites refresh remotely. DNS/general/node changes remain local.
# Native iOS parsing, network access and automatic refresh need device acceptance.

[general]
dns_exclusion_list = localhost, *.lan, *.local, home.arpa, *.home.arpa, time.apple.com, time-ios.apple.com, pool.ntp.org, *.pool.ntp.org, localhost.ptlogin2.qq.com
excluded_routes = 10.0.0.0/8, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.88.99.0/24, 192.168.0.0/16, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 255.255.255.255/32
icmp_auto_reply = true
fallback_udp_policy = reject
# No UDP allowlist/drop list: do not block ChatGPT voice/STUN/QUIC.

[dns]
# Both DoH endpoints are queried concurrently. No automatic system fallback promise.
# Omitting no-ipv6 preserves AAAA support. Proxied destinations use node-side DNS.
doh-server = https://dns.alidns.com/dns-query, https://doh.pub/dns-query
server = /localhost/system
server = /lan/system
server = /*.lan/system
server = /local/system
server = /*.local/system
server = /home.arpa/system
server = /*.home.arpa/system
server = /captive.apple.com/system
# localhost relies on OS/system resolution; no unsupported address=/localhost/127.0.0.1.

[policy]
# Rules use built-in proxy: select your node in the app.

[server_remote]
# Add private subscriptions on the phone only.

[server_local]
# Add private nodes on the phone only.

[filter_remote]
https://raw.githubusercontent.com/SHIKI1255/quantumultx-config/release/rules.list, tag=SHIKI1255-Rules, update-interval=86400, opt-parser=false, inserted-resource=false, enabled=true

[filter_local]
{{BOOTSTRAP_RULES}}
final, proxy

[rewrite_remote]
https://raw.githubusercontent.com/SHIKI1255/quantumultx-config/release/rewrite.list, tag=SHIKI1255-Rewrite, update-interval=86400, opt-parser=false, enabled=true

[rewrite_local]
# Builder extracts these into rewrite.list and leaves this section empty in the template.
^http://(www\.)?g\.cn([/?#].*)?$ url 302 https://www.google.com$2
^http://(www\.)?google\.cn([/?#].*)?$ url 302 https://www.google.com$2

[task_local]
# Empty: no scheduled scripts.

[http_backend]
# Empty: no local HTTP backend.

[mitm]
# Required configuration module, intentionally empty: no certificate or hostnames.
